<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bexus AI Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #131314;
            --bg-sidebar: #171717;
            --bg-hover: #212121;
            --bg-active: #2f2f2f;
            --border-color: #2b2b2b;
            --text-primary: #f1f1f1;
            --text-secondary: #9aa0a6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-primary); height: 100vh; overflow: hidden; }
        .app-wrapper { display: flex; height: 100vh; width: 100vw; }
        
        /* Sidebar */
        .sidebar { width: 260px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 12px; }
        .sidebar-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .brand-box { display: flex; align-items: center; gap: 10px; }
        .brand-logo { width: 28px; height: 28px; background: #fff; color: #000; font-weight: bold; font-size: 14px; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
        .brand-name { font-size: 14px; font-weight: 600; }
        .new-chat-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); padding: 10px 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 500; margin-bottom: 12px; transition: 0.2s; }
        .new-chat-btn:hover { background: var(--bg-hover); }
        .search-chats { display: flex; align-items: center; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 12px; gap: 8px; margin-bottom: 15px; }
        .search-chats i { color: var(--text-secondary); font-size: 12px; }
        .search-chats input { background: transparent; border: none; color: #fff; outline: none; font-size: 13px; width: 100%; }
        .chats-category { font-size: 11px; color: var(--text-secondary); padding: 0 8px 6px 8px; font-weight: 600; }
        .chat-history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
        .history-item { padding: 10px 12px; border-radius: 8px; font-size: 13px; color: var(--text-secondary); cursor: pointer; }
        .history-item:hover { background: var(--bg-hover); color: var(--text-primary); }
        .history-item.active { background: var(--bg-active); color: var(--text-primary); }
        
        /* Sidebar Footer */
        .sidebar-footer { border-top: 1px solid var(--border-color); padding-top: 10px; }
        .user-profile { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; }
        .user-avatar { width: 30px; height: 30px; background: #4f46e5; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; }
        .user-info { display: flex; flex-direction: column; }
        .user-info span:first-child { font-size: 13px; font-weight: 500; text-transform: capitalize; }
        
        /* Chat Main */
        .chat-main { flex: 1; display: flex; flex-direction: column; background-color: var(--bg-main); position: relative; }
        .main-header { padding: 15px 25px; display: flex; align-items: center; font-size: 16px; font-weight: 600; color: var(--text-secondary); }
        .chat-messages-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .welcome-screen { margin-top: 20vh; text-align: center; }
        .welcome-screen h1 { font-size: 32px; font-weight: 500; color: #c4c7c5; }
        
        /* Chat Input */
        .chat-input-section { padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .input-container { width: 100%; max-width: 750px; background: var(--bg-sidebar); border: 1px solid var(--border-color); border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
        .input-container:focus-within { border-color: #555; }
        textarea { width: 100%; background: transparent; border: none; color: #fff; outline: none; resize: none; font-size: 15px; max-height: 150px; line-height: 1.5; }
        .input-actions-left { display: flex; align-items: center; gap: 8px; }
        .tool-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary); padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .tool-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .tool-btn.active { background: #1e3a8a; border-color: #3b82f6; color: #93c5fd; }
        .send-btn { align-self: flex-end; background: #fff; border: none; width: 32px; height: 32px; border-radius: 50%; color: #000; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .send-btn:disabled { background: #333; color: #666; cursor: not-allowed; }
        .disclaimer-footer { font-size: 11px; color: var(--text-secondary); margin-top: 10px; text-align: center; }
        
        /* Messages */
        .message-row { width: 100%; max-width: 750px; display: flex; margin-bottom: 24px; gap: 16px; }
        .message-row.user { justify-content: flex-end; }
        .msg-bubble { padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; max-width: 80%; }
        .message-row.user .msg-bubble { background: var(--bg-hover); color: #fff; border-top-right-radius: 2px; }
        .message-row.ai .msg-bubble { background: transparent; color: var(--text-primary); padding: 0; }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-top">
                <div class="brand-box">
                    <div class="brand-logo">B</div>
                    <span class="brand-name">Bexus AI Pro</span>
                </div>
            </div>

            <button class="new-chat-btn" onclick="startNewChat()">
                <i class="fa-solid fa-plus"></i> New chat
            </button>

            <div class="search-chats">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search chats" id="chat-search" oninput="filterChats()">
            </div>

            <div class="chats-category">Chats</div>
            
            <div class="chat-history-list" id="history-list">
                <div class="history-item active">New chat</div>
            </div>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar">U</div>
                    <div class="user-info">
                        <span>ubaid</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <header class="main-header">
                <span>Bexus AI Pro</span>
            </header>

            <div class="chat-messages-container" id="chat-messages">
                <div class="welcome-screen" id="welcome-screen">
                    <h1>What can I help with today?</h1>
                </div>
            </div>

            <div class="chat-input-section">
                <div class="input-container">
                    <div class="input-actions-left">
                        <button class="tool-btn"><i class="fa-solid fa-plus"></i></button>
                        <button class="tool-btn web-search-btn" onclick="toggleWebSearch()"><i class="fa-solid fa-globe"></i> Web search</button>
                    </div>
                    <textarea id="user-input" placeholder="Message Bexus AI Pro..." rows="1" oninput="autoResize(this)" onkeydown="handleKeyPress(event)"></textarea>
                    <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>
                        <i class="fa-solid fa-arrow-up"></i>
                    </button>
                </div>
                <div class="disclaimer-footer">
                    Bexus AI Pro can make mistakes. Consider checking important information.
                </div>
            </div>
        </main>
    </div>

    <script>
        const textarea = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        textarea.addEventListener('input', function() {
            if (this.value.trim().length > 0) {
                sendBtn.removeAttribute('disabled');
            } else {
                sendBtn.setAttribute('disabled', 'true');
            }
        });

        function autoResize(element) {
            element.style.height = 'auto';
            element.style.height = element.scrollHeight + 'px';
        }

        let webSearchActive = false;
        function toggleWebSearch() {
            webSearchActive = !webSearchActive;
            const btn = document.querySelector('.web-search-btn');
            if (webSearchActive) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        }

        function sendMessage() {
            const text = textarea.value.trim();
            if (!text) return;

            const chatContainer = document.getElementById('chat-messages');
            const welcomeScreen = document.getElementById('welcome-screen');
            if (welcomeScreen) { welcomeScreen.remove(); }

            chatContainer.insertAdjacentHTML('beforeend', `
                <div class="message-row user">
                    <div class="msg-bubble">${escapeHtml(text)}</div>
                </div>
            `);

            textarea.value = '';
            textarea.style.height = 'auto';
            sendBtn.setAttribute('disabled', 'true');
            chatContainer.scrollTop = chatContainer.scrollHeight;

            setTimeout(() => {
                chatContainer.insertAdjacentHTML('beforeend', `
                    <div class="message-row ai">
                        <div class="msg-bubble">
                            <p>I am analyzing your request regarding "${escapeHtml(text)}". As Bexus AI Pro, my systems are ready to help.</p>
                        </div>
                    </div>
                `);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 1000);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function startNewChat() {
            const chatContainer = document.getElementById('chat-messages');
            chatContainer.innerHTML = `
                <div class="welcome-screen" id="welcome-screen">
                    <h1>What can I help with today?</h1>
                </div>
            `;
        }

        function filterChats() {
            const query = document.getElementById('chat-search').value.toLowerCase();
            document.querySelectorAll('.history-item').forEach(item => {
                item.style.display = item.textContent.toLowerCase().includes(query) ? 'block' : 'none';
            });
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
