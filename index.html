<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bexus AI Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #0e0f13;
            --bg-panel: #14161f;
            --bg-card: #1b1e29;
            --accent: #00f3ff;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #2a2e3d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }

        .app-layout {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 14px;
            flex-shrink: 0;
        }

        .brand {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #fff;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 28px;
            height: 28px;
            background: var(--accent);
            color: #000;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .new-chat-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
            transition: 0.2s;
        }

        .new-chat-btn:hover {
            background: var(--bg-card);
            border-color: var(--accent);
        }

        .history-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .history-item:hover, .history-item.active {
            background: var(--bg-card);
            color: var(--text-main);
        }

        .user-box {
            border-top: 1px solid var(--border);
            padding-top: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 500;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            background: #6366f1;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        /* Main Chat Window */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-deep);
            position: relative;
            height: 100vh;
            overflow: hidden;
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            font-size: 15px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-deep);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .welcome-box {
            margin: auto;
            text-align: center;
        }

        .welcome-box h1 {
            font-size: 28px;
            font-weight: 500;
            color: var(--text-muted);
        }

        /* Message Alignment */
        .message-row {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .message-row.user {
            align-items: flex-end;
        }

        .message-row.ai {
            align-items: flex-start;
        }

        .message-bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
        }

        .message-row.user .message-bubble {
            background: var(--bg-card);
            color: #fff;
            border-top-right-radius: 2px;
            border: 1px solid var(--border);
        }

        .message-row.ai .message-bubble {
            background: var(--bg-panel);
            color: var(--text-main);
            border-top-left-radius: 2px;
            border: 1px solid var(--border);
        }

        /* Input Area */
        .input-area {
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--bg-deep);
            border-top: 1px solid var(--border);
        }

        .input-box {
            width: 100%;
            max-width: 750px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-box:focus-within {
            border-color: var(--accent);
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            resize: none;
            font-size: 14px;
            max-height: 120px;
            line-height: 1.5;
        }

        .input-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tool-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
        }

        .tool-btn:hover {
            color: #fff;
            border-color: #fff;
        }

        .send-btn {
            background: var(--accent);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            color: #000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }

        .send-btn:disabled {
            background: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .footer-note {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">B</div>
                BEXUS AI PRO
            </div>
            <button class="new-chat-btn" onclick="startNewChat()">
                <i class="fa-solid fa-plus"></i> New Chat
            </button>
            <div class="history-container" id="history-list">
                <div class="history-item active">Neural Core Session</div>
            </div>
            <div class="user-box">
                <div class="user-avatar">U</div>
                <span>ubaid</span>
            </div>
        </aside>

        <!-- Main Chat -->
        <main class="chat-main">
            <header class="chat-header">
                <span>Neural Core v3.5</span>
                <span style="font-size: 12px; color: var(--accent);"><i class="fa-solid fa-circle" style="font-size: 8px;"></i> Online</span>
            </header>

            <div class="chat-messages" id="chat-messages">
                <div class="welcome-box" id="welcome-box">
                    <h1>What can I help with today?</h1>
                </div>
            </div>

            <div class="input-area">
                <div class="input-box">
                    <textarea id="user-input" placeholder="Message Bexus AI Pro..." rows="1" oninput="autoResize(this)" onkeydown="checkEnter(event)"></textarea>
                    <div class="input-tools">
                        <button class="tool-btn"><i class="fa-solid fa-globe"></i> Web Search</button>
                        <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>
                            <i class="fa-solid fa-arrow-up"></i>
                        </button>
                    </div>
                </div>
                <div class="footer-note">Bexus AI Pro can make mistakes. Verify important information.</div>
            </div>
        </main>
    </div>

    <script>
        const input = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const messages = document.getElementById('chat-messages');

        input.addEventListener('input', function() {
            if(this.value.trim().length > 0) {
                sendBtn.removeAttribute('disabled');
            } else {
                sendBtn.setAttribute('disabled', 'true');
            }
        });

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }

        function checkEnter(e) {
            if(e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function sendMessage() {
            const text = input.value.trim();
            if(!text) return;

            const welcome = document.getElementById('welcome-box');
            if(welcome) welcome.remove();

            // 1. User Message Add Karein
            messages.insertAdjacentHTML('beforeend', `
                <div class="message-row user">
                    <div class="message-bubble">${escapeHtml(text)}</div>
                </div>
            `);

            input.value = '';
            input.style.height = 'auto';
            sendBtn.setAttribute('disabled', 'true');
            messages.scrollTop = messages.scrollHeight;

            // 2. AI Response Typewriter Effect ke sath
            setTimeout(() => {
                const aiRowId = 'ai-msg-' + Date.now();
                messages.insertAdjacentHTML('beforeend', `
                    <div class="message-row ai">
                        <div class="message-bubble" id="${aiRowId}"></div>
                    </div>
                `);

                const bubble = document.getElementById(aiRowId);
                const responseText = `Bexus AI Neural Core: Main aapke query "${text}" ko process kar raha hoon. Systems bilkul ready hain!`;
                
                let i = 0;
                function typeWriter() {
                    if (i < responseText.length) {
                        bubble.innerHTML += responseText.charAt(i);
                        i++;
                        messages.scrollTop = messages.scrollHeight;
                        setTimeout(typeWriter, 15); // Typing speed
                    }
                }
                typeWriter();

            }, 500);
        }

        function startNewChat() {
            messages.innerHTML = `
                <div class="welcome-box" id="welcome-box">
                    <h1>What can I help with today?</h1>
                </div>
            `;
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
