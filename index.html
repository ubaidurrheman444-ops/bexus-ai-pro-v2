<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bexus AI Pro</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- AUTHENTICATION SCREEN -->
    <div id="auth-container" class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">B</div>
            <h2>Welcome to Bexus AI Pro</h2>
            <p>Sign in to access advanced neural systems</p>
            <button class="auth-btn" onclick="handleLogin()">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Initialize Session
            </button>
        </div>
    </div>

    <!-- MAIN APP DASHBOARD -->
    <div id="app-container" class="app-wrapper hidden">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <div class="brand-box">
                    <div class="brand-logo">B</div>
                    <span class="brand-name">Bexus AI Pro</span>
                </div>
                <button class="icon-btn" onclick="toggleSidebar()" title="Toggle Sidebar">
                    <i class="fa-solid fa-panel-folds"></i>
                </button>
            </div>

            <button class="new-chat-btn" onclick="startNewChat()">
                <i class="fa-solid fa-plus"></i> New chat
            </button>

            <div class="search-chats">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search chats" id="chat-search" oninput="filterChats()">
            </div>

            <div class="chats-category">Chats</div>
            
            <div class="chat-history-list" id="history-list">
                <div class="history-item active" onclick="selectChat(this)">New chat</div>
            </div>

            <div class="sidebar-footer">
                <div class="user-profile" onclick="handleLogout()">
                    <div class="user-avatar" id="user-initial">U</div>
                    <div class="user-info">
                        <span id="username-display">ubaid</span>
                        <span class="logout-text">Click to sign out</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <header class="main-header">
                <div class="model-selector-dropdown">
                    <span>Bexus AI Pro</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
            </header>

            <div class="chat-messages-container" id="chat-messages">
                <!-- Empty State or Welcome Message -->
                <div class="welcome-screen" id="welcome-screen">
                    <h1>What can I help with today?</h1>
                </div>
            </div>

            <div class="chat-input-section">
                <div class="input-container">
                    <div class="input-actions-left">
                        <button class="tool-btn" title="Attach file"><i class="fa-solid fa-plus"></i></button>
                        <button class="tool-btn web-search-btn" onclick="toggleWebSearch()"><i class="fa-solid fa-globe"></i> Web search</button>
                    </div>
                    <textarea id="user-input" placeholder="Message Bexus AI Pro..." rows="1" oninput="autoResize(this)" onkeydown="handleKeyPress(event)"></textarea>
                    <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>
                        <i class="fa-solid fa-arrow-up"></i>
                    </button>
                </div>
                <div class="disclaimer-footer">
                    Bexus AI Pro can make mistakes. Consider checking important information.
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
